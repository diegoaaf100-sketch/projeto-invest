name: Atualizar Indicadores Diários

on:
  schedule:
    # Roda todos os dias às 09:00 UTC (ajuste o horário conforme preferir)
    - cron: '0 9 * * *'
  workflow_dispatch: # Permite rodar manualmente a qualquer momento pelo site do GitHub

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar script de coleta
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python main.py
